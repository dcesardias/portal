<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Carga</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/portal.css?v=__APP_VERSION__">
    <link rel="stylesheet" href="/assets/css/admin-shared.css?v=__APP_VERSION__">
    <style>
        /* Sistema de Carga — estilos de página
           Prefixo sc- isola do admin-shared.css */

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            color: #111827;
            background: #f3f4f6;
        }

        /* ─── Tokens ─────────────────────────────────── */
        :root {
            --sc-red:         #c8102e;
            --sc-red-dark:    #a30d25;
            --sc-red-light:   #fbe7ea;
            --sc-red-mid:     #f4c4cc;
            --sc-danger:      #991b1b;
            --sc-danger-bg:   #fef2f2;
            --sc-success:     #166534;
            --sc-success-bg:  #f0fdf4;
            --sc-warn:        #92400e;
            --sc-warn-bg:     #fffbeb;
            --sc-surface:     #ffffff;
            --sc-bg:          #f3f4f6;
            --sc-border:      #e5e7eb;
            --sc-border-2:    #d1d5db;
            --sc-text:        #111827;
            --sc-text-2:      #6b7280;
            --sc-text-3:      #9ca3af;
            --sc-excel:       #1d7240;
        }

        /* ─── Layout ─────────────────────────────────── */
        .sc-layout {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ─── Sidebar ────────────────────────────────── */
        .sc-sidebar {
            width: 264px;
            flex-shrink: 0;
            background: var(--sc-surface);
            border-right: 1px solid var(--sc-border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sc-sidebar-head {
            padding: 14px 14px 10px;
            border-bottom: 1px solid var(--sc-border);
            flex-shrink: 0;
        }

        .sc-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .sc-brand-mark {
            width: 32px;
            height: 32px;
            background: var(--sc-red);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 13px;
            flex-shrink: 0;
        }

        .sc-brand-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--sc-text);
            line-height: 1.2;
        }

        .sc-brand-sub {
            font-size: 11px;
            color: var(--sc-text-3);
            margin-top: 1px;
        }

        .sc-sidebar-nav {
            display: flex;
            gap: 6px;
        }

        .sc-nav-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 6px 8px;
            border: 1px solid var(--sc-border);
            border-radius: 6px;
            background: transparent;
            color: var(--sc-text-2);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            font-family: inherit;
            transition: border-color 0.14s, color 0.14s, background 0.14s;
        }

        .sc-nav-btn:hover {
            border-color: var(--sc-red);
            color: var(--sc-red);
            background: var(--sc-red-light);
        }

        /* ─── Search ─────────────────────────────────── */
        .sc-search {
            padding: 9px 10px;
            border-bottom: 1px solid var(--sc-border);
            flex-shrink: 0;
        }

        .sc-search-wrap { position: relative; }

        .sc-search-ico {
            position: absolute;
            left: 9px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--sc-text-3);
            font-size: 11px;
            pointer-events: none;
        }

        #clearSearch {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--sc-text-3);
            font-size: 11px;
            cursor: pointer;
            display: none;
            padding: 2px;
            transition: color 0.12s;
        }

        #clearSearch:hover { color: var(--sc-red); }
        #searchInput:not(:placeholder-shown) ~ #clearSearch { display: block; }

        #searchInput {
            width: 100%;
            padding: 7px 24px 7px 26px;
            border: 1px solid var(--sc-border);
            border-radius: 6px;
            font-size: 12px;
            font-family: inherit;
            background: var(--sc-bg);
            color: var(--sc-text);
            transition: border-color 0.14s, box-shadow 0.14s;
        }

        #searchInput:focus {
            outline: none;
            border-color: var(--sc-red);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(200, 16, 46, 0.08);
        }

        #searchInput::placeholder { color: var(--sc-text-3); }

        /* ─── Table list ─────────────────────────────── */
        .sc-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 8px 32px;
        }

        .sc-list::-webkit-scrollbar { width: 4px; }
        .sc-list::-webkit-scrollbar-track { background: transparent; }
        .sc-list::-webkit-scrollbar-thumb { background: var(--sc-border-2); border-radius: 4px; }

        /* Group */
        .sc-group { margin-bottom: 2px; }

        .sc-group-hdr {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 6px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.12s;
            user-select: none;
        }

        .sc-group-hdr:hover { background: var(--sc-bg); }

        .sc-group-glyph {
            font-size: 13px;
            width: 18px;
            text-align: center;
            flex-shrink: 0;
        }

        .sc-group-txt { flex: 1; min-width: 0; }

        .sc-group-nm {
            font-size: 11px;
            font-weight: 700;
            color: var(--sc-text-2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sc-group-dsc {
            font-size: 11px;
            color: var(--sc-text-3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sc-group-chv {
            font-size: 10px;
            color: var(--sc-text-3);
            transition: transform 0.18s ease;
            flex-shrink: 0;
        }

        .sc-group.open > .sc-group-hdr .sc-group-chv {
            transform: rotate(90deg);
        }

        .sc-group-items {
            padding-left: 4px;
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.22s ease;
        }

        /* Table item */
        .sc-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 7px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.12s;
            position: relative;
            margin-bottom: 1px;
        }

        .sc-item:hover { background: var(--sc-bg); }
        .sc-item.active { background: var(--sc-red-light); }

        .sc-item-glyph {
            font-size: 15px;
            width: 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .sc-item-info { flex: 1; min-width: 0; }

        .sc-item-nm {
            font-size: 13px;
            font-weight: 600;
            color: var(--sc-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sc-item.active .sc-item-nm { color: var(--sc-red); }

        .sc-item-meta {
            font-size: 11px;
            color: var(--sc-text-3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 1px;
        }

        .sc-item-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #d97706;
            flex-shrink: 0;
            animation: sc-blink 1.6s ease-in-out infinite;
        }

        @keyframes sc-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ─── Main ───────────────────────────────────── */
        .sc-main {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sc-main::-webkit-scrollbar { width: 6px; }
        .sc-main::-webkit-scrollbar-track { background: var(--sc-bg); }
        .sc-main::-webkit-scrollbar-thumb { background: var(--sc-border-2); border-radius: 4px; }

        /* Empty state */
        .sc-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 48px 32px;
            min-height: 100%;
        }

        .sc-empty-icon {
            width: 52px;
            height: 52px;
            background: var(--sc-border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--sc-text-3);
            margin-bottom: 16px;
        }

        .sc-empty-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--sc-text-2);
            margin-bottom: 6px;
        }

        .sc-empty-hint {
            font-size: 13px;
            color: var(--sc-text-3);
            max-width: 280px;
            line-height: 1.55;
        }

        /* ─── Panel ──────────────────────────────────── */
        .sc-panel {
            padding: 28px 32px 48px;
            max-width: 680px;
            width: 100%;
            margin: 0 auto;
            animation: sc-in 0.2s ease-out;
        }

        @keyframes sc-in {
            from { opacity: 0; transform: translateY(5px); }
            to   { opacity: 1; transform: none; }
        }

        /* Panel header */
        .sc-panel-hdr {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--sc-border);
        }

        .sc-panel-glyph {
            font-size: 30px;
            line-height: 1;
            flex-shrink: 0;
            padding-top: 2px;
        }

        .sc-panel-text { flex: 1; min-width: 0; }

        .sc-panel-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--sc-text);
            margin-bottom: 3px;
            text-wrap: balance;
        }

        .sc-panel-desc {
            font-size: 13px;
            color: var(--sc-text-2);
            line-height: 1.5;
        }

        .sc-panel-stats {
            flex-shrink: 0;
            text-align: right;
        }

        .sc-stat-val {
            font-size: 15px;
            font-weight: 700;
            color: var(--sc-text);
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
        }

        .sc-stat-lbl {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--sc-text-3);
        }

        /* Section */
        .sc-section { margin-bottom: 20px; }

        .sc-section-hd {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .sc-lbl {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--sc-text-2);
        }

        /* ─── Load type ──────────────────────────────── */
        .sc-load-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .sc-load-opt {
            padding: 12px 14px;
            border: 1.5px solid var(--sc-border);
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.14s, background 0.14s;
            background: var(--sc-surface);
            user-select: none;
        }

        .sc-load-opt:not(.sc-load-disabled):hover {
            border-color: var(--sc-border-2);
        }

        .sc-load-opt.sc-sel {
            border-color: var(--sc-red);
            background: var(--sc-red-light);
        }

        .sc-load-opt.sc-load-disabled {
            opacity: 0.38;
            cursor: not-allowed;
        }

        .sc-load-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .sc-radio {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid var(--sc-border-2);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.13s;
        }

        .sc-load-opt.sc-sel .sc-radio {
            border-color: var(--sc-red);
            background: var(--sc-red);
        }

        .sc-radio-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #fff;
            display: none;
        }

        .sc-load-opt.sc-sel .sc-radio-dot { display: block; }

        .sc-load-nm {
            font-size: 13px;
            font-weight: 600;
            color: var(--sc-text);
        }

        .sc-load-desc {
            font-size: 12px;
            color: var(--sc-text-2);
            line-height: 1.4;
            padding-left: 22px;
        }

        .sc-warn-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--sc-warn-bg);
            color: var(--sc-warn);
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 4px;
            margin-top: 5px;
            margin-left: 22px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* ─── Dropzone ───────────────────────────────── */
        .sc-dz {
            border: 2px dashed var(--sc-border);
            border-radius: 10px;
            padding: 24px 20px;
            text-align: center;
            cursor: pointer;
            background: var(--sc-surface);
            transition: border-color 0.14s, background 0.14s;
        }

        .sc-dz:hover,
        .sc-dz.over {
            border-color: var(--sc-red);
            background: var(--sc-red-light);
        }

        .sc-dz.has-file {
            border-style: solid;
            border-color: var(--sc-red);
            background: var(--sc-red-light);
            padding: 14px 16px;
        }

        .sc-dz-idle-icon {
            font-size: 24px;
            color: var(--sc-text-3);
            margin-bottom: 8px;
        }

        .sc-dz-idle-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--sc-text);
            margin-bottom: 3px;
        }

        .sc-dz-idle-hint {
            font-size: 12px;
            color: var(--sc-text-3);
        }

        .sc-dz-file-row {
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
        }

        .sc-dz-file-ico {
            font-size: 22px;
            color: var(--sc-excel);
            flex-shrink: 0;
        }

        .sc-dz-file-info { flex: 1; min-width: 0; }

        .sc-dz-file-nm {
            font-size: 13px;
            font-weight: 600;
            color: var(--sc-red);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sc-dz-file-sz {
            font-size: 12px;
            color: var(--sc-text-3);
        }

        .sc-dz-remove {
            background: #fff;
            border: 1px solid var(--sc-border-2);
            border-radius: 5px;
            padding: 4px 10px;
            font-size: 12px;
            color: var(--sc-text-2);
            cursor: pointer;
            transition: border-color 0.13s, color 0.13s;
            flex-shrink: 0;
            font-family: inherit;
        }

        .sc-dz-remove:hover {
            border-color: var(--sc-danger);
            color: var(--sc-danger);
        }

        /* ─── Progress ───────────────────────────────── */
        .sc-prog {
            background: var(--sc-bg);
            border: 1px solid var(--sc-border);
            border-radius: 10px;
            padding: 13px 15px;
            margin-top: 12px;
            display: none;
        }

        .sc-prog.active { display: block; }

        .sc-prog-hd {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .sc-prog-stage {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            font-weight: 600;
            color: var(--sc-text);
        }

        .sc-prog-spin {
            width: 10px;
            height: 10px;
            border: 2px solid var(--sc-red-mid);
            border-top-color: var(--sc-red);
            border-radius: 50%;
            animation: sc-spin 0.65s linear infinite;
            flex-shrink: 0;
        }

        @keyframes sc-spin { to { transform: rotate(360deg); } }

        .sc-prog-stage.done .sc-prog-spin,
        .sc-prog-stage.err  .sc-prog-spin { display: none; }

        .sc-prog-pct {
            font-size: 12px;
            font-weight: 700;
            color: var(--sc-text-2);
            font-variant-numeric: tabular-nums;
        }

        .sc-prog-bar {
            height: 4px;
            background: var(--sc-border);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 7px;
        }

        .sc-prog-fill {
            height: 100%;
            border-radius: 20px;
            background: var(--sc-red);
            transition: width 0.35s ease;
            width: 0%;
        }

        .sc-prog-fill.done { background: var(--sc-success); }
        .sc-prog-fill.err  { background: var(--sc-danger); }

        .sc-prog-meta {
            font-size: 11px;
            color: var(--sc-text-3);
            font-variant-numeric: tabular-nums;
        }

        /* ─── Actions ────────────────────────────────── */
        .sc-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .sc-btn-up {
            padding: 10px 22px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.14s, transform 0.14s, box-shadow 0.14s;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: var(--sc-red);
            color: #fff;
            box-shadow: 0 2px 8px rgba(200, 16, 46, 0.28);
            font-family: inherit;
        }

        .sc-btn-up:hover:not(:disabled) {
            opacity: 0.88;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(200, 16, 46, 0.35);
        }

        .sc-btn-up:active:not(:disabled) {
            transform: none;
            opacity: 0.96;
        }

        .sc-btn-up:disabled {
            background: var(--sc-border-2) !important;
            color: var(--sc-text-3) !important;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
            opacity: 1;
        }

        .sc-btn-up.danger {
            background: var(--sc-danger);
            box-shadow: 0 2px 8px rgba(153, 27, 27, 0.3);
        }

        .sc-btn-up.danger:hover:not(:disabled) {
            box-shadow: 0 4px 16px rgba(153, 27, 27, 0.4);
        }

        .sc-btn-ghost {
            padding: 9px 13px;
            border: 1px solid var(--sc-border-2);
            border-radius: 7px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: border-color 0.13s, color 0.13s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--sc-surface);
            color: var(--sc-text-2);
            font-family: inherit;
            text-decoration: none;
        }

        .sc-btn-ghost:hover {
            border-color: var(--sc-text-2);
            color: var(--sc-text);
        }

        /* ─── Alert ──────────────────────────────────── */
        .sc-alert {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 9px 13px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 18px;
        }

        .sc-alert.show  { display: flex; }
        .sc-alert-err   { background: var(--sc-danger-bg);  color: var(--sc-danger);  border: 1px solid rgba(153, 27, 27, 0.18); }
        .sc-alert-ok    { background: var(--sc-success-bg); color: var(--sc-success); border: 1px solid rgba(22, 101, 52, 0.18); }
        .sc-alert-info  { background: #eff6ff;              color: #1e40af;            border: 1px solid rgba(30, 64, 175, 0.18); }

        /* ─── Input ──────────────────────────────────── */
        .sc-input {
            width: 100%;
            padding: 9px 11px;
            border: 1.5px solid var(--sc-border-2);
            border-radius: 7px;
            font-size: 13px;
            font-family: inherit;
            background: var(--sc-surface);
            color: var(--sc-text);
            transition: border-color 0.13s, box-shadow 0.13s;
        }

        .sc-input:focus {
            outline: none;
            border-color: var(--sc-red);
            box-shadow: 0 0 0 3px rgba(200, 16, 46, 0.08);
        }

        .sc-input-hint {
            font-size: 11px;
            color: var(--sc-text-3);
            margin-top: 5px;
            line-height: 1.4;
        }

        .sc-prefix-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sc-prefix-tag {
            font-size: 12px;
            font-weight: 700;
            color: var(--sc-text-2);
            background: var(--sc-bg);
            border: 1.5px solid var(--sc-border-2);
            border-radius: 6px;
            padding: 8px 10px;
            flex-shrink: 0;
            font-family: 'Cascadia Mono', 'Consolas', 'Courier New', monospace;
            white-space: nowrap;
        }

        .sc-prefix-row .sc-input { flex: 1; }

        /* ─── DW Update panel ────────────────────────── */
        .sc-main.sc-main-dw { overflow-y: hidden; }

        .sc-dw-panel {
            max-width: none;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 24px 32px 20px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .sc-dw-form-wrap { max-width: 640px; flex-shrink: 0; }

        #dwResultSection {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .sc-dw-daterow {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            align-items: end;
            gap: 12px;
            margin-bottom: 10px;
        }

        .sc-dw-daterow .sc-btn-up { white-space: nowrap; }

        @media (max-width: 640px) {
            .sc-dw-daterow { grid-template-columns: 1fr 1fr; }
            .sc-dw-daterow .sc-btn-up { grid-column: 1 / -1; }
        }

        .sc-dw-date-lbl {
            display: block;
            font-size: 12px;
            color: var(--sc-text-2);
            margin-bottom: 5px;
        }

        .sc-dw-total {
            font-size: 12px;
            color: var(--sc-text-2);
            font-variant-numeric: tabular-nums;
        }

        .sc-dw-table-wrap {
            flex: 1;
            min-height: 200px;
            overflow: auto;
            border: 1px solid var(--sc-border);
            border-radius: 8px;
        }

        .sc-dw-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .sc-dw-table th, .sc-dw-table td {
            padding: 7px 10px;
            text-align: left;
            white-space: nowrap;
            border-bottom: 1px solid var(--sc-border);
        }

        .sc-dw-table th {
            position: sticky;
            top: 0;
            background: var(--sc-bg);
            color: var(--sc-text-2);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 0.3px;
        }

        .sc-dw-th {
            cursor: pointer;
            user-select: none;
        }

        .sc-dw-th:hover { color: var(--sc-text); }
        .sc-dw-th-active { color: var(--sc-red); }
        .sc-dw-th i { font-size: 11px; }

        .sc-dw-table tbody tr:hover { background: var(--sc-bg); }

        .sc-dw-empty {
            padding: 24px;
            text-align: center;
            color: var(--sc-text-3);
            font-size: 13px;
        }

        .sc-dw-pager {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            font-size: 12px;
            color: var(--sc-text-2);
            flex-shrink: 0;
        }

        .sc-dw-pg-info { font-size: 11px; color: var(--sc-text-3); }

        .sc-dw-pg-nav {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .sc-dw-pg-btn {
            min-width: 28px;
            height: 28px;
            padding: 0 8px;
            border: 1px solid var(--sc-border-2);
            border-radius: 6px;
            background: var(--sc-surface);
            color: var(--sc-text-2);
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            transition: border-color 0.13s, color 0.13s, background 0.13s;
        }

        .sc-dw-pg-btn:hover:not(:disabled) {
            border-color: var(--sc-text-2);
            color: var(--sc-text);
        }

        .sc-dw-pg-btn.active {
            background: var(--sc-red);
            border-color: var(--sc-red);
            color: #fff;
            font-weight: 700;
            cursor: default;
        }

        .sc-dw-pg-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .sc-dw-pg-ellipsis {
            padding: 0 4px;
            color: var(--sc-text-3);
        }

        /* ─── Responsive ─────────────────────────────── */
        @media (max-width: 640px) {
            .sc-layout { flex-direction: column; }
            .sc-sidebar { width: 100%; height: 42vh; flex-shrink: 0; }
            .sc-panel { padding: 16px 16px 32px; }
            .sc-load-grid { grid-template-columns: 1fr; }
            .sc-panel-stats { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <div class="sc-layout">
        <aside class="sc-sidebar">
            <div class="sc-sidebar-head">
                <div class="sc-brand">
                    <div class="sc-brand-mark"><i class="fas fa-table"></i></div>
                    <div>
                        <div class="sc-brand-name">Sistema de Carga</div>
                        <div class="sc-brand-sub">Importação de dados Excel</div>
                    </div>
                </div>
                <div class="sc-sidebar-nav">
                    <a class="sc-nav-btn" href="/excel/admin.html">
                        <i class="fas fa-sliders-h"></i> Admin
                    </a>
                    <button class="sc-nav-btn" onclick="window.close(); if (!window.opener) window.location.href='/'">
                        <i class="fas fa-arrow-left"></i> Voltar
                    </button>
                </div>
            </div>
            <div class="sc-search">
                <div class="sc-search-wrap">
                    <i class="fas fa-search sc-search-ico"></i>
                    <input type="search" id="searchInput" placeholder="Buscar tabelas..."
                           autocomplete="off" autocorrect="off" autocapitalize="off"
                           spellcheck="false" inputmode="search">
                    <i class="fas fa-times" id="clearSearch"></i>
                </div>
            </div>
            <div class="sc-list" id="tablesList"></div>
        </aside>

        <main class="sc-main" id="uploadArea">
            <div class="sc-empty">
                <div class="sc-empty-icon"><i class="fas fa-file-upload"></i></div>
                <div class="sc-empty-title">Selecione uma tabela</div>
                <div class="sc-empty-hint">Escolha uma tabela na lista ao lado para iniciar uma carga de dados</div>
            </div>
        </main>
    </div>

    <script>
        (function () {
            let token = sessionStorage.getItem('authToken');
            if (!token) {
                token = localStorage.getItem('authToken');
                if (token) {
                    sessionStorage.setItem('authToken', token);
                    const u = localStorage.getItem('currentUser');
                    if (u) sessionStorage.setItem('currentUser', u);
                }
            }
            if (!token) {
                alert('Acesso negado. Faça login como administrador.');
                window.location.href = '/';
                return;
            }
            fetch('/api/verify-token', { headers: { 'Authorization': 'Bearer ' + token } })
                .then(async res => {
                    if (res.status === 401 || res.status === 403) {
                        sessionStorage.removeItem('authToken');
                        localStorage.removeItem('authToken');
                        alert('Sessão expirada. Faça login novamente.');
                        window.location.href = '/';
                        return;
                    }
                    if (!res.ok) {
                        alert('Erro ao validar sessão (HTTP ' + res.status + '). Tente novamente.');
                        return;
                    }
                    const data = await res.json();
                    const apps = (data.user && data.user.apps) || [];
                    if (!data.user || (!data.user.isAdmin && !apps.includes('excel'))) {
                        alert('Acesso negado. Apenas administradores podem acessar.');
                        window.location.href = '/';
                    }
                })
                .catch(() => {
                    alert('Não foi possível validar a sessão (erro de rede). Tente recarregar.');
                });
        })();
    </script>
    <script src="jobsManager.js?v=__APP_VERSION__"></script>
    <script src="app.js?v=__APP_VERSION__"></script>
</body>
</html>
