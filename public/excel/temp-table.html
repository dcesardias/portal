<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Temporária - Upload Excel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .upload-section {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-section:hover {
            border-color: #764ba2;
            background: #f0f1ff;
        }

        .upload-section.dragover {
            border-color: #764ba2;
            background: #e8e9ff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 15px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .analysis-section {
            display: none;
            margin-top: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            opacity: 0.9;
        }

        .columns-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            overflow: hidden;
            border-radius: 10px;
        }

        .columns-table th {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: left;
        }

        .columns-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }

        .columns-table tr:hover {
            background: #f8f9ff;
        }

        select {
            width: 100%;
            padding: 8px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .table-name-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 1em;
            margin-bottom: 20px;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #eee;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .back-btn {
            background: #6c757d;
            margin-right: 10px;
        }

        .sample-values {
            font-size: 0.85em;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>�� Tabela Temporária</h1>
        <p class="subtitle">Faça upload de um arquivo Excel e crie uma tabela temporária no banco de dados</p>

        <div class="alert" id="alert"></div>
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill">0%</div>
        </div>

        <div class="upload-section" id="uploadSection">
            <div class="upload-icon">📁</div>
            <h3>Arraste seu arquivo Excel aqui</h3>
            <p>ou</p>
            <button class="btn" onclick="document.getElementById('fileInput').click()">Selecionar Arquivo</button>
            <input type="file" id="fileInput" accept=".xlsx,.xls">
            <p style="margin-top: 15px; color: #999;">Formatos aceitos: .xlsx, .xls</p>
        </div>

        <div class="analysis-section" id="analysisSection">
            <h2 style="color: #667eea; margin-bottom: 20px;">�� Análise do Arquivo</h2>
            
            <div class="stats" id="stats"></div>

            <h3 style="color: #667eea; margin-bottom: 15px;">Configure as Colunas:</h3>
            <table class="columns-table" id="columnsTable">
                <thead>
                    <tr>
                        <th>Coluna</th>
                        <th>Tipo Detectado</th>
                        <th>Tipo SQL</th>
                        <th>Valores de Exemplo</th>
                    </tr>
                </thead>
                <tbody id="columnsBody"></tbody>
            </table>

            <h3 style="color: #667eea; margin-bottom: 15px;">Nome da Tabela:</h3>
            <input type="text" class="table-name-input" id="tableName" placeholder="Digite o nome (será criada como TEMP_SeuNome)">

            <div style="text-align: center;">
                <button class="btn back-btn" onclick="resetUpload()">← Voltar</button>
                <button class="btn" id="loadBtn" onclick="loadExcel()">Carregar Excel no Banco</button>
            </div>
        </div>
    </div>

    <script>
        let currentFile = null;
        let analysisData = null;

        // Configurar drag and drop
        const uploadSection = document.getElementById('uploadSection');
        
        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.classList.add('dragover');
        });

        uploadSection.addEventListener('dragleave', () => {
            uploadSection.classList.remove('dragover');
        });

        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        document.getElementById('fileInput').addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function showAlert(message, type = 'error') {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert ${type}`;
            alert.style.display = 'block';
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        function setProgress(percent) {
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            progressBar.style.display = 'block';
            progressFill.style.width = percent + '%';
            progressFill.textContent = Math.round(percent) + '%';
        }

        function hideProgress() {
            document.getElementById('progressBar').style.display = 'none';
        }

        async function handleFile(file) {
            if (!file.name.match(/\.(xlsx|xls)$/i)) {
                showAlert('Por favor, selecione um arquivo Excel válido (.xlsx ou .xls)');
                return;
            }

            currentFile = file;
            showAlert('Analisando arquivo...', 'success');
            setProgress(30);

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/excel/analyze-excel', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Erro ao analisar arquivo: ${response.statusText}`);
                }

                analysisData = await response.json();
                setProgress(100);
                displayAnalysis(analysisData);
                hideProgress();
            } catch (error) {
                console.error('Erro:', error);
                showAlert('Erro ao analisar arquivo: ' + error.message);
                hideProgress();
            }
        }

        function displayAnalysis(data) {
            // Mostrar estatísticas
            const statsHtml = `
                <div class="stat-card">
                    <div class="stat-value">${data.rows}</div>
                    <div class="stat-label">Linhas</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${data.columns.length}</div>
                    <div class="stat-label">Colunas</div>
                </div>
            `;
            document.getElementById('stats').innerHTML = statsHtml;

            // Mostrar colunas
            const columnsHtml = data.columns.map((col, index) => `
                <tr>
                    <td><strong>${col.name}</strong></td>
                    <td>${col.pandas_type}</td>
                    <td>
                        <select id="sqlType_${index}">
                            <option value="INT" ${col.sql_type === 'INT' ? 'selected' : ''}>INT</option>
                            <option value="BIGINT" ${col.sql_type === 'BIGINT' ? 'selected' : ''}>BIGINT</option>
                            <option value="FLOAT" ${col.sql_type === 'FLOAT' ? 'selected' : ''}>FLOAT</option>
                            <option value="DATETIME" ${col.sql_type === 'DATETIME' ? 'selected' : ''}>DATETIME</option>
                            <option value="DATE" ${col.sql_type === 'DATE' ? 'selected' : ''}>DATE</option>
                            <option value="BIT" ${col.sql_type === 'BIT' ? 'selected' : ''}>BIT (0/1)</option>
                            <option value="NVARCHAR(50)" ${col.sql_type === 'NVARCHAR(50)' ? 'selected' : ''}>NVARCHAR(50)</option>
                            <option value="NVARCHAR(100)" ${col.sql_type === 'NVARCHAR(100)' ? 'selected' : ''}>NVARCHAR(100)</option>
                            <option value="NVARCHAR(255)" ${col.sql_type === 'NVARCHAR(255)' ? 'selected' : ''}>NVARCHAR(255)</option>
                            <option value="NVARCHAR(MAX)" ${col.sql_type === 'NVARCHAR(MAX)' ? 'selected' : ''}>NVARCHAR(MAX)</option>
                        </select>
                    </td>
                    <td class="sample-values">${col.sample_values.slice(0, 3).join(', ')}</td>
                </tr>
            `).join('');
            document.getElementById('columnsBody').innerHTML = columnsHtml;

            // Sugerir nome da tabela
            const suggestedName = currentFile.name.replace(/\.(xlsx|xls)$/i, '').replace(/[^a-zA-Z0-9_]/g, '_');
            document.getElementById('tableName').value = suggestedName;

            // Mostrar seção de análise
            document.getElementById('uploadSection').style.display = 'none';
            document.getElementById('analysisSection').style.display = 'block';
        }

        async function loadExcel() {
            const tableName = document.getElementById('tableName').value.trim();
            
            if (!tableName) {
                showAlert('Por favor, digite um nome para a tabela');
                return;
            }

            if (!/^[a-zA-Z0-9_]+$/.test(tableName)) {
                showAlert('Nome da tabela deve conter apenas letras, números e underscore');
                return;
            }

            // Coletar tipos de colunas configurados
            const columns = analysisData.columns.map((col, index) => ({
                name: col.name,
                sql_type: document.getElementById(`sqlType_${index}`).value
            }));

            const loadBtn = document.getElementById('loadBtn');
            loadBtn.disabled = true;
            showAlert('Carregando dados no banco...', 'success');
            setProgress(0);

            const formData = new FormData();
            formData.append('file', currentFile);
            formData.append('table_name', tableName);
            formData.append('columns', JSON.stringify(columns));

            try {
                const response = await fetch('/api/excel/load-custom-excel', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || response.statusText);
                }

                const result = await response.json();
                setProgress(100);
                showAlert(`✅ Sucesso! Tabela ${result.table_name} criada com ${result.rows_loaded} linhas`, 'success');
                
                setTimeout(() => {
                    resetUpload();
                }, 3000);

            } catch (error) {
                console.error('Erro:', error);
                showAlert('Erro ao carregar dados: ' + error.message);
                loadBtn.disabled = false;
            } finally {
                hideProgress();
            }
        }

        function resetUpload() {
            currentFile = null;
            analysisData = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('uploadSection').style.display = 'block';
            document.getElementById('analysisSection').style.display = 'none';
            document.getElementById('loadBtn').disabled = false;
            hideProgress();
        }
    </script>
</body>
</html>
