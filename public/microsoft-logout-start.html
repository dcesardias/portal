<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saindo da conta Microsoft</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: 'Segoe UI', sans-serif;
            background: #f3f6fb;
            color: #16324f;
        }

        .card {
            width: min(92vw, 420px);
            padding: 24px;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 18px 40px rgba(22, 50, 79, 0.15);
        }

        h1 {
            font-size: 20px;
            margin: 0 0 12px;
        }

        p {
            margin: 0;
            line-height: 1.5;
            color: #46607c;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Saindo da conta Microsoft</h1>
        <p>Esta janela será fechada automaticamente assim que o logout for concluído.</p>
    </div>

    <script>
        (function() {
            const completeUrl = new URL('/microsoft-logout-complete.html', window.location.origin);
            completeUrl.searchParams.set('ts', Date.now().toString());

            const logoutUrl = new URL('https://login.microsoftonline.com/common/oauth2/v2.0/logout');
            logoutUrl.searchParams.set('post_logout_redirect_uri', completeUrl.toString());

            window.location.replace(logoutUrl.toString());
        })();
    </script>
</body>
</html>
