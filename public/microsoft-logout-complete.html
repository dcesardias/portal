<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout concluído</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: 'Segoe UI', sans-serif;
            background: #f3f6fb;
            color: #16324f;
        }

        .card {
            width: min(92vw, 420px);
            padding: 24px;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 18px 40px rgba(22, 50, 79, 0.15);
            text-align: center;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 12px;
        }

        p {
            margin: 0;
            line-height: 1.5;
            color: #46607c;
        }

        button {
            margin-top: 18px;
            border: none;
            border-radius: 999px;
            padding: 10px 16px;
            background: #0066cc;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Logout Microsoft concluído</h1>
        <p>Se esta janela não fechar sozinha, use o botão abaixo e volte ao portal para abrir o painel novamente.</p>
        <button type="button" onclick="window.close()">Fechar janela</button>
    </div>

    <script>
        (function() {
            if (window.opener && !window.opener.closed) {
                try {
                    window.opener.postMessage({ type: 'portal-microsoft-logout-complete' }, window.location.origin);
                } catch (error) {
                    console.error('Falha ao notificar a janela principal:', error);
                }
            }

            window.setTimeout(() => {
                window.close();
            }, 300);
        })();
    </script>
</body>
</html>
